services:
  - type: web
    name: ros-qii-api
    runtime: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ros-qii-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: TEST_ACCOUNT_USERNAME
        value: qii_test
      - key: TEST_ACCOUNT_PASSWORD
        sync: false

databases:
  - name: ros-qii-db
